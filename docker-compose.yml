version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: endoscopie_db
    environment:
      POSTGRES_USER: endoscopie_user
      POSTGRES_PASSWORD: endoscopie_password
      POSTGRES_DB: endoscopie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endoscopie_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
